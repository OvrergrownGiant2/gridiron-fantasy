# Free Render servers fall asleep after 15 minutes without visitors, which also pauses draft
# timers, waivers and live scoring. This pings the server every 10 minutes to keep it awake.
# Turn it on by adding a repository variable SERVER_URL (Settings → Secrets and variables →
# Actions → Variables), e.g. https://gridiron-fantasy.onrender.com
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.SERVER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.SERVER_URL }}/healthz" || echo "Server did not answer (it may be waking up or redeploying)."
