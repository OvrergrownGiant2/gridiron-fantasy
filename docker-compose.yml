# Local production-like stack: PostgreSQL + app. Usage: docker compose up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: gridiron, POSTGRES_PASSWORD: gridiron, POSTGRES_DB: gridiron }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gridiron"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8787:8787"]
    environment:
      DATABASE_URL: postgresql://gridiron:gridiron@db:5432/gridiron
      PUBLIC_URL: http://localhost:8787
      NODE_ENV: production
      NFL_PROVIDER: ${NFL_PROVIDER:-none}
      SPORTSDATAIO_API_KEY: ${SPORTSDATAIO_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
volumes: { pgdata: {} }
